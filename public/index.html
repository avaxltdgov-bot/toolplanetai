      .tool-card > div:first-child { border-radius: 14px !important; box-shadow: 0 8px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.25) !important; transform: translateZ(30px) !important; transition: transform .35s ease !important; }
